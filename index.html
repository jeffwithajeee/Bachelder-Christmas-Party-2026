<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bachelder Christmas Party 2026</title>
<style>
  :root { --red:#b3202a; --green:#1f5d3a; --gold:#d4a63c; --cream:#fff8ec; --ink:#2b2220; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia,"Times New Roman",serif; background:var(--green);
    background-image: radial-gradient(circle at 20% 20%, rgba(255,255,255,.08) 0 2px, transparent 3px), radial-gradient(circle at 70% 60%, rgba(255,255,255,.08) 0 2px, transparent 3px);
    background-size: 60px 60px, 90px 90px; color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { background:var(--cream); max-width:560px; width:100%; border:6px double var(--gold); border-radius:12px; padding:40px 28px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  .emoji { font-size:2.5rem; letter-spacing:.5rem; }
  h1 { color:var(--red); font-size:clamp(2rem,8vw,3rem); margin:12px 0 4px; }
  .sub { color:var(--green); font-style:italic; font-size:1.2rem; margin:0 0 24px; }
  hr { border:0; border-top:2px dotted var(--gold); margin:24px 0; }
  .details dt { font-size:.8rem; letter-spacing:.15em; text-transform:uppercase; color:var(--red); margin-top:16px; }
  .details dd { margin:4px 0 0; font-size:1.25rem; }
  .note { font-size:1rem; line-height:1.5; }
  .rsvp { display:inline-block; margin-top:8px; padding:12px 28px; background:var(--red); color:#fff; text-decoration:none; border-radius:999px; font-size:1.1rem; }
  .rsvp:hover { background:#8f1821; }
</style>
</head>
<body>
  <main class="card">
    <div class="emoji" aria-hidden="true">🎄 ⭐ 🎁</div>
    <h1>You're Invited!</h1>
    <p class="sub">Bachelder Christmas Party 2026</p>
    <hr>
    <dl class="details">
      <dt>Date</dt><dd>[Date to be announced]</dd>
      <dt>Time</dt><dd>[Time to be announced]</dd>
      <dt>Where</dt><dd>[Address to be announced]</dd>
    </dl>
    <hr>
    <p class="note">Food, festive cheer, and good company. More details coming soon!</p>
    <a class="rsvp" href="#">RSVP (coming soon)</a>
  </main>
</body>
</html>
